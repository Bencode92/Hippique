name: Scrape cotes live pré-course

on:
  schedule:
    # Toutes les 10 minutes entre 8h et 20h UTC (10h-22h France, heure d'été).
    # L'ancienne fenêtre (*/15 10-18) s'arrêtait à 20h Paris : les réunions du
    # soir n'étaient jamais capturées. Le pas de 10 min absorbe aussi le délai
    # de la file d'attente des runners, qui faisait échouer la condition
    # `0 < minutes_avant <= FENETRE` et laissait des courses sans cotes.
    - cron: '*/10 8-20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Scraper cotes live pré-course
        run: python scraper_pre_course.py

      - name: Commit si nouvelles cotes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action - Cotes Live"

          mkdir -p data/cotes_live
          # Régénère l'index AVANT le check git diff pour qu'il soit inclus dans le commit
          python3 scripts/update_cotes_live_index.py
          git add data/cotes_live/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Pas de nouvelles cotes"
          else
            git stash -u || true
            git pull origin main --rebase || true
            git stash pop || true
            python3 scripts/update_cotes_live_index.py
            git add data/cotes_live/
            git commit -m "⏱️ Cotes live pré-course $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
