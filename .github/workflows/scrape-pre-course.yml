name: Scrape cotes live pré-course

on:
  schedule:
    # Trois boucles de ~4 h qui se relaient : 10h → 22h Paris (heure d'été).
    # Un cron « toutes les 10 minutes » partait avec 5 à 20 minutes de retard
    # et ne gardait qu'un relevé : 2 courses de la règle sur 11 avaient une
    # cote live en août-septembre. Ici le scraper tourne en continu, relève
    # toutes les ~40 s dans les 6 dernières minutes avant le départ, garde le
    # relevé le plus proche du départ et l'historique, et pousse toutes les
    # 3 minutes. Le test séquentiel a besoin du favori à T-2, pas à la clôture.
    - cron: '0 8 * * *'
    - cron: '0 12 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      duree:
        description: 'Durée de la boucle en minutes'
        default: '235'

permissions:
  contents: write

# deux boucles ne doivent pas écrire en même temps ; la suivante attend
concurrency:
  group: cotes-live
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 250

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Identité git (les push sont faits par le scraper, toutes les 3 min)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action - Cotes Live"

      - name: Boucle de relevés
        env:
          TZ: Europe/Paris
        run: python scraper_pre_course.py --boucle ${{ github.event.inputs.duree || '235' }}
