name: Extraction des courses France Galop

on:
  schedule:
    # Tôt le matin — le programme de la veille au soir n'a PAS les cotes : au
    # 05/10 l'extraction de 00h39 écrivait `cote: null` partout, et le cron de
    # 10h UTC (12h Paris) tombait APRÈS la première course de 11h05. Deux
    # passages tôt, parce que le cron GitHub dérive (5 à 20 min couramment,
    # 5 h observées) : si l'un glisse, l'autre a déjà écrit.
    - cron: '0 6 * * *'
    - cron: '0 8 * * *'
    # Matin 10h UTC (12h France) — cotes d'ouverture + programme
    - cron: '0 10 * * *'
    # Soir 20h UTC (22h France) — résultats + cotes finales
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date des courses (YYYY-MM-DD ou today/tomorrow)'
        required: false
        default: 'today'

permissions:
  contents: write

# Heure de Paris : les relevés de cotes sont horodatés en heure locale et
# js/temps.js les lit comme tels, mais tout ce qui formate une date ici
# (nom de fichier, date du jour) doit désigner la même journée de courses.
env:
  TZ: Europe/Paris

jobs:
  extract_courses:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run extraction script
        run: |
          DATE_ARG="${{ github.event.inputs.date || 'today' }}"
          python scraper_courses_pmu.py ${DATE_ARG}

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git stash -u || true
          git pull origin main --rebase
          git stash pop || true

          mkdir -p data/courses
          # Dès l'extraction, le JSON du jour est prêt : rangs France Galop,
          # pastilles, forme et cotes — consultable tel quel sur GitHub, et lu
          # directement par la carte (plus de 13 Mo de classements à charger).
          # Généré APRÈS le rebase, sinon le stash pop l'écraserait.
          node bench/precalcul_jour.mjs $(date -u +%Y-%m-%d) || true
          node bench/precalcul_jour.mjs $(date -u -d 'tomorrow' +%Y-%m-%d) || true
          git add data/jour/ data/courses/*.json

          # Régénère _index.json pour que le frontend ait la liste à jour.
          # Inclus ici car les pushs faits via GITHUB_TOKEN ne déclenchent
          # PAS d'autres workflows (sécurité anti-boucle de GitHub Actions).
          python3 scripts/update_courses_index.py
          git add data/jour/ data/courses/_index.json

          if git diff --cached --quiet; then
            echo "Aucun changement détecté"
          else
            git commit -m "📊 Courses + cotes PMU - $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
