name: Suivi de la règle (SPRT)

# La regle est testee de facon SEQUENTIELLE : le verdict tombe quand
# l'accumulation penche assez d'un cote, pas a une date fixe. Encore faut-il
# que la statistique avance toute seule — sans quoi elle resterait a zero et
# le dispositif ne servirait a rien.
#
# Ce workflow relance le test apres chaque collecte de resultats et republie
# data/sprt_etat.json, que la page affiche.

on:
  schedule:
    # 23h UTC, apres le backtest quotidien de 22h qui complete data/histo
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sprt:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dépendances
        run: pip install requests

      # data/histo et data/rapports ne sont alimentés par AUCUN workflow : ils
      # étaient gelés au 08/09 alors que le test lit ces deux fichiers pour
      # trouver les courses de la règle. Sans ça, le test aurait enregistré
      # zéro pari à partir du 1er octobre.
      - name: Compléter l'historique et les rapports (10 derniers jours)
        run: |
          python3 backfill_histo.py $(date -u -d '10 days ago' +%Y-%m-%d) $(date -u +%Y-%m-%d) || true
          python3 backfill_rapports.py $(date -u +%Y-%m) || true

      - name: Relancer le test séquentiel
        run: node bench/sprt_regle.mjs | tee /tmp/sprt.txt

      - name: Publier historique, rapports et état du test
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action - Suivi règle"
          git add data/histo/ data/rapports/ data/sprt_etat.json data/sprt_journal.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Rien à publier"
          else
            git commit -m "📐 Suivi règle $(date -u +'%Y-%m-%d') — historique, rapports, état du test"
            for i in 1 2 3 4 5; do
              git pull --rebase -q origin main || true
              git push origin main && break || sleep $((5 * i))
            done
          fi

      - name: Résumé dans le job
        run: |
          {
            echo '## Test séquentiel de la règle'
            echo '```'
            cat /tmp/sprt.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit si l'état a changé
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action - SPRT"
          git add data/sprt_etat.json
          if git diff --cached --quiet; then
            echo "État inchangé"
          else
            # Le verdict, quand il tombe, doit etre visible dans l'historique git
            VERDICT=$(python3 -c "import json;d=json.load(open('data/sprt_etat.json'));print(d.get('verdict') or ('%d paris, statistique %+.3f' % (d['paris'], d['statistique'])))")
            git stash -u || true
            git pull origin main --rebase || true
            git stash pop || true
            git add data/sprt_etat.json
            git commit -m "📐 SPRT règle : $VERDICT"
            git push
          fi
