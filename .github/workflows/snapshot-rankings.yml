name: Snapshot Rankings

on:
  schedule:
    # Hebdomadaire, le lundi à 4h30 UTC — avant toute course, donc jamais un
    # snapshot de l'après-midi qui contiendrait les gains du jour (05/09 15h44).
    # Lancé à la main dix fois en cinq mois, le snapshot du 12/07 a servi 377
    # réunions (33 % de la base) avec jusqu'à huit semaines de retard.
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Créer le snapshot brut horodaté
        run: |
          STAMP=$(date -u +"%Y-%m-%d_%Hh%M")
          echo "📸 Stamp: $STAMP"
          # Snapshot des bruts (Rang officiel France Galop, ratios calculés à la volée)
          # Plus de pondered_ranking qui inventait un ScoreMixte → classement aligné avec le site
          python3 scripts/snapshot_brut.py "$STAMP"
          echo ""
          echo "=== Contenu du snapshot ==="
          ls -la "data/rankings/$STAMP/"

      - name: Commit et push
        run: |
          STAMP=$(date -u +"%Y-%m-%d_%Hh%M")
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action - Snapshot"
          git add data/rankings/
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "📸 Snapshot rankings ${STAMP}"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
