name: Snapshot Rankings

on:
  schedule:
    # Hebdomadaire, le lundi à 4h30 UTC — avant toute course, donc jamais un
    # snapshot de l'après-midi qui contiendrait les gains du jour (05/09 15h44).
    #
    # ATTENTION (29/09/2026) : ce workflow ne télécharge RIEN. Il horodate une
    # copie de data/raw_csv/, qui contient les exports que Benoit récupère à la
    # main sur France Galop. Sans réimport, le cron fabriquait des dossiers
    # « 2026-09-21 » et « 2026-09-28 » contenant les données du 5 septembre.
    # snapshot_brut.py refuse désormais un snapshot identique au précédent
    # (sortie 78) : le run échoue, visible dans Actions, et c'est le rappel
    # qu'il faut réimporter les CSV.
    - cron: '30 4 * * 1'

  # Déclencheur réel : l'import des CSV lui-même. Le cron hebdomadaire ne
  # servait à rien le jour où Benoit réimporte un samedi matin — l'archive
  # n'aurait été créée que le lundi, et la carte aurait servi tout le week-end
  # des classements d'un mois (constaté le 04/10/2026). Ici l'archive est
  # horodatée dans la minute qui suit le dépôt des CSV, donc avant les courses.
  # Le workflow n'écrit que dans data/rankings/ : il ne peut pas se relancer.
  push:
    paths:
      - 'data/raw_csv/**.csv'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Créer le snapshot brut horodaté
        run: |
          STAMP=$(date -u +"%Y-%m-%d_%Hh%M")
          echo "📸 Stamp: $STAMP"
          # Snapshot des bruts (Rang officiel France Galop, ratios calculés à la volée)
          # Plus de pondered_ranking qui inventait un ScoreMixte → classement aligné avec le site
          python3 scripts/snapshot_brut.py "$STAMP"
          echo ""
          echo "=== Contenu du snapshot ==="
          ls -la "data/rankings/$STAMP/"

      - name: Rappel si les CSV n'ont pas été réimportés
        if: failure()
        run: echo "::warning::Snapshot abandonné — data/raw_csv n'a pas changé depuis le dernier snapshot. Réimporte les classements depuis France Galop."

      - name: Commit et push
        run: |
          STAMP=$(date -u +"%Y-%m-%d_%Hh%M")
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action - Snapshot"
          git add data/rankings/
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "📸 Snapshot rankings ${STAMP}"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Sans ça, data/jour/<date>.json garde les rangs de l'ancien snapshot
      # jusqu'au prochain passage du scraper : la carte afficherait un
      # classement périmé alors que l'archive fraîche est déjà dans le dépôt.
      - name: Recalculer la carte du jour
        run: |
          node bench/precalcul_jour.mjs || true
          git add data/jour/ || true
          if git diff --cached --quiet; then
            echo "Carte du jour inchangée"
          else
            git commit -m "♻️ Carte du jour recalculée sur le snapshot frais"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
